# ===================================================================
# Personal Expense & Budget Tracker - Application Configuration
# ===================================================================

spring.application.name=PersonalExpenseTracker
server.port=8080
spring.main.allow-bean-definition-overriding=true
spring.sql.init.mode=never

# Active profile: 'dev' allows instant zero-setup execution out-of-the-box.
# Change to 'mysql' or launch with '--spring.profiles.active=mysql' when your local MySQL server is running!
spring.profiles.active=dev

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart File Upload limits for CSV Import
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
